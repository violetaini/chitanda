name: Build & Release 3X-UI Chitanda

on:
  push:
    branches:
      - 3x-ui
    paths:
      - 'database/**'
      - 'web/**'
      - 'sub/**'
      - 'xray/**'
      - 'main.go'
      - 'install.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "amd64"
            arch_name: "amd64"
            xray_pkg: "64"
          - platform: "arm64"
            arch_name: "arm64"
            xray_pkg: "arm64-v8a"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            sudo apt install -y gcc-aarch64-linux-gnu
          fi

      - name: Build Customized 3X-UI with Chitanda
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          
          go build -ldflags="-s -w" -o xui-release -v main.go
          
          mkdir -p x-ui/bin
          cp xui-release x-ui/x-ui
          cp -r web x-ui/
          cp x-ui.service x-ui/
          cp x-ui.sh x-ui/
          
          cd x-ui/bin
          XRAY_URL="https://github.com/violetaini/chitanda/releases/download/xray-chitanda-v26.3.27/"
          wget ${XRAY_URL}Xray-linux-${{ matrix.xray_pkg }}.zip
          unzip Xray-linux-${{ matrix.xray_pkg }}.zip
          rm -f Xray-linux-${{ matrix.xray_pkg }}.zip
          mv xray xray-linux-${{ matrix.arch_name }}
          chmod +x xray-linux-${{ matrix.arch_name }}
          
          cd ../..
          tar -czvf "x-ui-linux-${{ matrix.arch_name }}.tar.gz" x-ui
          mkdir -p dist
          mv "x-ui-linux-${{ matrix.arch_name }}.tar.gz" dist/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "3x-ui-v2.3.11"
          name: "3X-UI v2.3.11 (Native Chitanda Protocol Support)"
          body: |
            Customized **3X-UI v2.3.11** with full visual UI support for **Chitanda Protocol** (`h2`, `h3`, `auto`, `h1`).
            
            - Built-in Chitanda Inbound configuration forms
            - One-click 32-byte PSK Key generator
            - Integrated `xray-chitanda` core
            - Automatic Subscription & Node Link generation
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true
