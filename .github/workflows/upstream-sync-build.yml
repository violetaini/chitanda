name: Upstream Sync & Automated Release

on:
  push:
    branches: [ main ]
    paths:
      - 'integration/**'
      - 'pkg/**'
      - 'scripts/**'
      - 'go.mod'
      - '.github/workflows/upstream-sync-build.yml'
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and overwrite existing release assets'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "mihomo"
            repo: "MetaCubeX/mihomo"
            name_prefix: "mihomo-chitanda"
            pkg_path: "."
          - target: "xray"
            repo: "XTLS/Xray-core"
            name_prefix: "xray-chitanda"
            pkg_path: "./main"

    steps:
      - name: Checkout Chitanda Core Repository
        uses: actions/checkout@v4

      - name: Set up Go (Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Latest Upstream Tag
        id: upstream_check
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/tags | jq -r '.[0].name')
          fi
          echo "Latest ${{ matrix.target }} Tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Check if this release tag already exists in our repo
          RELEASE_EXISTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ matrix.name_prefix }}-$LATEST_TAG | jq -r .id)
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.force_build }}" == "true" ] || [ "$RELEASE_EXISTS" == "null" ] || [ -z "$RELEASE_EXISTS" ]; then
            echo "Triggering build for ${{ matrix.name_prefix }}-$LATEST_TAG (Event: ${{ github.event_name }}, Force: ${{ inputs.force_build }})..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ matrix.name_prefix }}-$LATEST_TAG already exists and no changes forced. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream Source
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.upstream_check.outputs.upstream_tag }} https://github.com/${{ matrix.repo }}.git upstream_src

      - name: Inject Chitanda Protocol Adapter
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          if [ "${{ matrix.target }}" == "mihomo" ]; then
            python3 scripts/inject-mihomo.py upstream_src $PWD
          else
            python3 scripts/inject-xray.py upstream_src $PWD
          fi

      - name: Build Multi-Architecture Binaries
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          go mod tidy || true
          mkdir -p ../dist
          
          TAG="${{ steps.upstream_check.outputs.upstream_tag }}"
          
          # Targets: Linux AMD64/ARM64, Windows AMD64, macOS ARM64
          PLATFORMS=("linux/amd64" "linux/arm64" "windows/amd64" "darwin/arm64")
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" == "windows" ]; then EXT=".exe"; fi
            
            OUTPUT_NAME="${{ matrix.name_prefix }}-${TAG}-${GOOS}-${GOARCH}${EXT}"
            echo "Building $OUTPUT_NAME using ${{ matrix.pkg_path }}..."
            
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" -o "../dist/$OUTPUT_NAME" ${{ matrix.pkg_path }}
            
            cd ../dist
            
            # 1. Custom named archives
            if [ "$GOOS" == "windows" ]; then
              zip "${OUTPUT_NAME%.exe}.zip" "$OUTPUT_NAME"
            else
              tar -czf "${OUTPUT_NAME}.tar.gz" "$OUTPUT_NAME"
            fi
            
            # 2. Ecosystem standard naming
            if [ "${{ matrix.target }}" == "xray" ]; then
              # Standard Xray package naming: Xray-linux-64.zip, Xray-linux-arm64-v8a.zip, etc.
              XRAY_ARCH="$GOARCH"
              XRAY_OS="$GOOS"
              if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
              if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
              if [ "$GOOS" == "darwin" ]; then XRAY_OS="macos"; fi
              
              STD_ZIP="Xray-${XRAY_OS}-${XRAY_ARCH}.zip"
              cp "$OUTPUT_NAME" "xray${EXT}"
              zip "$STD_ZIP" "xray${EXT}"
              rm "xray${EXT}"
              
              # Generate .dgst sidecar for 3x-ui and downstream tool checksum verification
              SHA256_VAL=$(sha256sum "$STD_ZIP" | awk '{print $1}')
              echo "SHA256(${STD_ZIP})= ${SHA256_VAL}" > "${STD_ZIP}.dgst"
            elif [ "${{ matrix.target }}" == "mihomo" ]; then
              # Standard Mihomo package naming: mihomo-linux-amd64-v1.19.30.gz / .zip
              if [ "$GOOS" == "windows" ]; then
                cp "$OUTPUT_NAME" "mihomo.exe"
                zip "mihomo-${GOOS}-${GOARCH}-${TAG}.zip" "mihomo.exe"
                rm "mihomo.exe"
              else
                gzip -c "$OUTPUT_NAME" > "mihomo-${GOOS}-${GOARCH}-${TAG}.gz"
              fi
            fi
            
            rm "$OUTPUT_NAME"
            cd ../upstream_src
          done
          
          # Generate consolidated SHA256 checksums
          cd ../dist
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        if: steps.upstream_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ matrix.name_prefix }}-${{ steps.upstream_check.outputs.upstream_tag }}"
          name: "${{ matrix.name_prefix }} ${{ steps.upstream_check.outputs.upstream_tag }} (Chitanda Protocol Included)"
          body: |
            Automated build of **${{ matrix.repo }}** `${{ steps.upstream_check.outputs.upstream_tag }}` with native **Chitanda Protocol (`h2`, `h3`, `auto`, `h1`)** integrated.
            
            ### Included Assets:
            - **Ecosystem Standard Naming**: `Xray-linux-64.zip` (with `.dgst`), `Xray-linux-arm64-v8a.zip`, `mihomo-linux-amd64-...`
            - **Chitanda Standard Naming**: Multi-platform archives
            - **Checksums**: `sha256sums.txt`
            - **Commit**: `${{ github.sha }}`
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true
