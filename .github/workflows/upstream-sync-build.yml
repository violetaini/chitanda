name: Upstream Sync & Automated Release

on:
  push:
    branches: [ main ]
    paths:
      - 'integration/**'
      - 'pkg/**'
      - 'scripts/**'
      - 'go.mod'
      - '.github/workflows/upstream-sync-build.yml'
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and overwrite existing release assets'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  cleanup-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy and draft release objects
        run: |
          echo "Scanning all releases including drafts for legacy items..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases | jq -c '.[]' | while read -r rel; do
            rel_id=$(echo "$rel" | jq -r '.id')
            tag_name=$(echo "$rel" | jq -r '.tag_name // ""')
            rel_name=$(echo "$rel" | jq -r '.name // ""')
            if [[ "$tag_name" == *"xray-chitanda"* || "$tag_name" == *"mihomo-chitanda"* || "$rel_name" == *"xray-chitanda"* || "$rel_name" == *"mihomo-chitanda"* ]]; then
              echo ">>> Deleting legacy release ID $rel_id ($tag_name / $rel_name)..."
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/$rel_id"
            fi
          done

  check-and-build:
    needs: cleanup-legacy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "mihomo"
            repo: "MetaCubeX/mihomo"
            pkg_path: "."
          - target: "xray"
            repo: "XTLS/Xray-core"
            pkg_path: "./main"

    steps:
      - name: Checkout Chitanda Core Repository
        uses: actions/checkout@v4

      - name: Set up Go (Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Latest Upstream Tag
        id: upstream_check
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(curl -s https://api.github.com/repos/${{ matrix.repo }}/tags | jq -r '.[0].name')
          fi
          echo "Latest ${{ matrix.target }} Tag: $LATEST_TAG"
          echo "upstream_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Check if this release tag already exists in our repo
          RELEASE_EXISTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$LATEST_TAG | jq -r .id)
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.force_build }}" == "true" ] || [ "$RELEASE_EXISTS" == "null" ] || [ -z "$RELEASE_EXISTS" ]; then
            echo "Triggering build for $LATEST_TAG (Event: ${{ github.event_name }}, Force: ${{ inputs.force_build }})..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Release $LATEST_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone Upstream Source
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.upstream_check.outputs.upstream_tag }} https://github.com/${{ matrix.repo }}.git upstream_src

      - name: Inject Chitanda Protocol Adapter
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          if [ "${{ matrix.target }}" == "mihomo" ]; then
            python3 scripts/inject-mihomo.py upstream_src $PWD
          else
            python3 scripts/inject-xray.py upstream_src $PWD
          fi

      - name: Build Multi-Architecture Binaries
        if: steps.upstream_check.outputs.should_build == 'true'
        run: |
          cd upstream_src
          go mod tidy || true
          mkdir -p ../dist
          
          TAG="${{ steps.upstream_check.outputs.upstream_tag }}"
          
          # Platforms: Linux AMD64/ARM64, Windows AMD64, macOS ARM64/AMD64
          PLATFORMS=("linux/amd64" "linux/arm64" "windows/amd64" "darwin/arm64" "darwin/amd64")
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            EXT=""
            if [ "$GOOS" == "windows" ]; then EXT=".exe"; fi
            
            BIN_NAME="${{ matrix.target }}${EXT}"
            echo "Building $BIN_NAME for $GOOS/$GOARCH..."
            
            BUILD_FLAGS=""
            LDFLAGS="-s -w -buildid="
            if [ "${{ matrix.target }}" == "mihomo" ]; then
              BUILD_FLAGS="-tags with_gvisor"
              LDFLAGS="-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=${TAG}"
            fi
            
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build $BUILD_FLAGS -trimpath -ldflags="$LDFLAGS" -o "../dist/$BIN_NAME" ${{ matrix.pkg_path }}
            
            cd ../dist
            
            if [ "${{ matrix.target }}" == "xray" ]; then
              # Standard upstream Xray naming rules:
              # Xray-linux-64.zip, Xray-linux-arm64-v8a.zip, Xray-windows-64.zip, Xray-macos-arm64-v8a.zip, Xray-macos-64.zip
              XRAY_ARCH="$GOARCH"
              XRAY_OS="$GOOS"
              if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
              if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
              if [ "$GOOS" == "darwin" ]; then
                XRAY_OS="macos"
                if [ "$GOARCH" == "amd64" ]; then XRAY_ARCH="64"; fi
                if [ "$GOARCH" == "arm64" ]; then XRAY_ARCH="arm64-v8a"; fi
              fi
              
              STD_ZIP="Xray-${XRAY_OS}-${XRAY_ARCH}.zip"
              zip "$STD_ZIP" "xray${EXT}"
              rm -f "xray${EXT}"
              
              # Standard .dgst checksum file (SHA256)
              SHA256_VAL=$(sha256sum "$STD_ZIP" | awk '{print $1}')
              echo "SHA256(${STD_ZIP})= ${SHA256_VAL}" > "${STD_ZIP}.dgst"
            elif [ "${{ matrix.target }}" == "mihomo" ]; then
              # Standard upstream Mihomo naming rules:
              # mihomo-linux-amd64-v1.19.30.gz, mihomo-linux-arm64-v1.19.30.gz, mihomo-windows-amd64-v1.19.30.zip, etc.
              if [ "$GOOS" == "windows" ]; then
                zip "mihomo-${GOOS}-${GOARCH}-${TAG}.zip" "mihomo.exe"
                rm -f "mihomo.exe"
              else
                gzip -c "$BIN_NAME" > "mihomo-${GOOS}-${GOARCH}-${TAG}.gz"
                rm -f "$BIN_NAME"
              fi
            fi
            
            cd ../upstream_src
          done
          
          # Generate consolidated SHA256 checksums
          cd ../dist
          sha256sum * > sha256sums.txt

      - name: Publish GitHub Release
        if: steps.upstream_check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.upstream_check.outputs.upstream_tag }}"
          name: "${{ matrix.target }} ${{ steps.upstream_check.outputs.upstream_tag }}"
          body: |
            Automated release of **${{ matrix.repo }}** `${{ steps.upstream_check.outputs.upstream_tag }}` with native **Chitanda Protocol** integrated.
            
            ### Package Standard:
            - **Strict Ecosystem Alignment**: Identical naming rules to official upstream releases.
            - **gVisor TUN Support**: Compiled with `-tags with_gvisor` for full Clash Verge / Mihomo Party TUN compatibility.
            - **Checksum Sidecars**: `.dgst` sidecars and `sha256sums.txt` included.
            - **Commit**: `${{ github.sha }}`
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: false
          clobber: true
