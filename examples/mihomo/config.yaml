# Mihomo (Clash.Meta) - Chitanda 全トランスポートモード設定ファイル例
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  # -------------------------------------------------------------
  # モード 1: H2 ストリーム多重化モード (TLS 1.3 + HTTP/2 多重化) - デフォルト推奨
  # -------------------------------------------------------------
  - name: "Chitanda-01-H2-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "h2"
    sni: "jp.example.com"
    pool-size: 4
    udp: true

  # -------------------------------------------------------------
  # モード 2: H3 ネイティブ QUIC モード (HTTP/3 0-RTT + Head-of-Line ブロッキングなし)
  # -------------------------------------------------------------
  - name: "Chitanda-02-H3-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "h3"
    sni: "jp.example.com"
    udp: true

  # -------------------------------------------------------------
  # モード 3: Auto インテリジェント自己治癒モード (H2 主線 + 障害時 H3 へフォールバック)
  # -------------------------------------------------------------
  - name: "Chitanda-03-Auto-Tokyo"
    type: chitanda
    server: jp.example.com
    port: 443
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/api/v1/sync"
    transport: "auto"
    sni: "jp.example.com"
    pool-size: 4
    udp: true

  # -------------------------------------------------------------
  # モード 4: H1 IP 直指定・証明書不要実験モード (全二重 HTTP/1.1 AEAD + Plain-UDP)
  # -------------------------------------------------------------
  - name: "Chitanda-04-H1-DirectIP"
    type: chitanda
    server: 203.0.113.88
    port: 18200
    psk: "super-secure-pre-shared-key-sample-token"
    path: "/gateway/stream/v2"
    transport: "h1"
    udp: true

  # -------------------------------------------------------------
  # モード 5: Stream 専用線高スループットモード (RawStream TCP + AES-128-GCM + 動的難読化) - 専用線推奨
  # -------------------------------------------------------------
  - name: "Chitanda-05-Stream-Tokyo"
    type: chitanda
    server: 203.0.113.88
    port: 11323
    psk: "super-secure-pre-shared-key-sample-token"
    transport: "stream"
    server-id: "tokyo-node-01"
    udp: true

proxy-groups:
  - name: "PROXIES"
    type: select
    proxies:
      - "AUTO-FALLBACK"
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-04-H1-DirectIP"
      - "Chitanda-05-Stream-Tokyo"
      - DIRECT

  - name: "AUTO-FALLBACK"
    type: fallback
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-04-H1-DirectIP"
      - "Chitanda-05-Stream-Tokyo"

  - name: "LOAD-BALANCE"
    type: load-balance
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    proxies:
      - "Chitanda-01-H2-Tokyo"
      - "Chitanda-02-H3-Tokyo"
      - "Chitanda-03-Auto-Tokyo"
      - "Chitanda-05-Stream-Tokyo"

rules:
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXIES
