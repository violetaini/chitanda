{{define "form/chitanda"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <!-- PSK -->
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                PSK 密钥 <a-icon @click="inbound.settings.psk = RandomUtil.randomSeq(32)" type="sync" style="cursor: pointer; color: #1890ff;"></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="inbound.settings.psk" placeholder="32 字节预共享密钥"></a-input>
    </a-form-item>

    <!-- Transport Mode -->
    <a-form-item label="传输模式 (Transport)">
        <a-select v-model="inbound.settings.transport" :dropdown-class-name="themeSwitcher.currentTheme" @change="onChitandaTransportChange">
            <a-select-option value="h2">h2 (TLS 1.3 + HTTP/2 多路复用 - 主线推荐)</a-select-option>
            <a-select-option value="h3">h3 (TLS 1.3 + QUIC Stream + HTTP/3)</a-select-option>
            <a-select-option value="auto">auto (H2 优先 & 丢包自愈 H3)</a-select-option>
            <a-select-option value="h1">h1 (纯 IP / 免证书 / 全双工 HTTP/1.1)</a-select-option>
        </a-select>
    </a-form-item>

    <!-- Path -->
    <a-form-item label="请求路径 (Path)">
        <a-input v-model.trim="inbound.settings.path" placeholder="/api/v1/sync"></a-input>
    </a-form-item>

    <!-- Strict SNI (Only for TLS modes: h2, h3, auto) -->
    <a-form-item v-if="inbound.settings.transport !== 'h1'" label="Strict SNI">
        <a-input v-model.trim="inbound.settings.strict_sni" placeholder="严格校验的 SNI 域名（可选，留空则匹配证书中任意域名）"></a-input>
    </a-form-item>

    <!-- Fallback -->
    <a-form-item label="回退防探测 (Fallback)">
        <a-input-group compact style="display: flex;">
            <a-select :value="getChitandaFallbackType()" @change="setChitandaFallbackType" style="width: 45%" :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option value="default">🏢 内置防探测默认页</a-select-option>
                <a-select-option value="127.0.0.1:8080">🌐 本地端口反代 (8080)</a-select-option>
                <a-select-option value="unix:/run/nginx.sock">🔌 Nginx UDS 反代</a-select-option>
                <a-select-option value="/var/www/html">📁 本地静态目录</a-select-option>
                <a-select-option value="custom">✏️ 自定义目标</a-select-option>
            </a-select>
            <a-input v-model.trim="inbound.settings.fallback" style="width: 55%" placeholder="default 或 127.0.0.1:8080"></a-input>
        </a-input-group>
        <div v-if="inbound.settings.fallback === 'default' || inbound.settings.fallback === 'builtin' || !inbound.settings.fallback" style="font-size: 12px; color: #52c41a; margin-top: 4px;">
            <a-icon type="check-circle" /> 已启用 Vanguard Global Operations Hub 内置伪装 ERP 响应式门户
        </div>
    </a-form-item>

    <!-- Notice for H1 Mode -->
    <a-form-item v-if="inbound.settings.transport === 'h1'" label="证书与加密">
        <a-alert message="纯 IP 直连免证书模式：内层采用 ChaCha20-Poly1305 AEAD 加密，无需配置 SSL 证书与 SNI。" type="info" show-icon />
    </a-form-item>
</a-form>
{{end}}
